# Slovion's production stack (docs/hosting.md). Values come from the .env file next to this file, which the deploy
# workflow writes from the GitHub "production" environment; nothing secret lives in the repository.
#   TAG                image tag (a commit SHA)          IMAGE_PREFIX   e.g. ghcr.io/david-letonja-ctg
#   SITE_ADDRESS       host name, or ":80" for HTTP      POSTGRES_PASSWORD
#   HTTP_PORT, HTTPS_PORT  host ports (80 and 443 by default; only changed for local tests)
name: slovion

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/david-letonja-ctg}/slovion-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/david-letonja-ctg}/slovion-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Slovion: Host=db;Port=5432;Database=slovion;Username=slovion;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: slovion
      POSTGRES_USER: slovion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slovion -d slovion"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

volumes:
  pgdata:
  caddy-data:
  caddy-config:
