name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NG_CLI_ANALYTICS: 'false'

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Slovion.slnx

      - name: Check formatting
        run: dotnet format Slovion.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Slovion.slnx --configuration Release --no-restore

      # Integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - name: Test
        run: dotnet test --solution Slovion.slnx --configuration Release --no-build

  client:
    name: Client (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check translation keys
        run: npm run i18n:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: slovion
          POSTGRES_USER: slovion
          POSTGRES_PASSWORD: slovion_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slovion -d slovion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Playwright starts the API (which migrates the database) and the client itself.
      - name: Test
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  containers:
    name: Containers (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          load: true
          tags: slovion-ci/slovion-api:test
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,scope=ci-api,mode=max

      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          load: true
          tags: slovion-ci/slovion-web:test
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,scope=ci-web,mode=max

      # The production stack, over plain HTTP on high ports, with a throwaway password.
      - name: Start the stack
        working-directory: deploy
        run: |
          {
            echo "IMAGE_PREFIX=slovion-ci"
            echo "TAG=test"
            echo "SITE_ADDRESS=:80"
            echo "POSTGRES_PASSWORD=ci-only-password"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
          } > .env
          docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: bash deploy/smoke-test.sh http://localhost:8080

      # Four runs without an upload target: each makes a dump, and only the newest 3 stay.
      - name: Backup script
        working-directory: deploy
        run: |
          for _ in 1 2 3 4; do bash backup.sh; sleep 1; done
          test "$(ls backups/slovion-*.dump | wc -l)" -eq 3
          docker compose cp "$(ls -1t backups/*.dump | head -n 1)" db:/tmp/latest.dump
          docker compose exec -T db pg_restore --list /tmp/latest.dump > /dev/null

      - name: Logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        working-directory: deploy
        run: docker compose down -v
